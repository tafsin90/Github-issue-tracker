<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Englaish Janala</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind + daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Open the modal using ID.showModal() method -->
    <button class="btn" onclick="my_modal_5.showModal()">open modal</button>
    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle" open>
      <div class="modal-box p-8">
        <div class="modal-container space-y-6">
          <div class="space-y-2">
            <h1 class="text-2xl font-semibold">Fix broken image URL</h1>
            <div class="space-x-2">
              <span class="bg-green-600 text-white rounded-full py-1 px-3">Opened</span>
              <span class="text-gray-600">&bull;</span>
              <span class="text-gray-600">Opened by Fahim Ahmed</span>
              <span class="text-gray-600">&bull;</span>
              <span class="text-gray-600">22/02/2026</span>
            </div>
          </div>

          <div class="flex flex-wrap gap-1">
            <span class="px-2 bg-red-100 text-red-700 text-center border border-red-700 rounded-full">
              <i class="fa-solid fa-bug text-red-700"></i>
              BUG
            </span>
            <span class="px-2 bg-yellow-100 text-yellow-600 text-center border border-yellow-600 rounded-full">
              <i class="fa-solid fa-circle-question text-yellow-700"></i>
              help
            </span>
          </div>

          <p class="text-gray-600 text-lg">The navigation menu doesn't collapse properly on mobile devices. Need to fix the responsive behavior.</p>

          <div class="flex ">
            <div class="flex-1 space-y-1">
              <h3 class="text-gray-600">Assignee:</h3>
              <h2 class="font-semibold">Fahim Ahmed</h2>
            </div>
            <div class="flex-1 space-y-1">
              <h3 class="text-gray-600">Priority:</h3>
              <div class="bg-red-600 text-white w-20 text-center rounded-full">High</div>
            </div>
          </div>

          <div class="modal-action">
            <form method="dialog">
              <!-- if there is a button in form, it will close the modal -->
              <button class="btn btn-primary px-8">Close</button>
            </form>
          </div>
        </div>
      </div>
    </dialog>
  </body>
</html>
