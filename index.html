<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon" />
    <title>G I T | Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- styles -->
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- login-page -->
    <section class="h-screen flex flex-col items-center justify-center">
      <div class="flex flex-col items-center justify-center p-8 space-y-6 w-3/12 rounded-lg shadow-[0_5px_10px_0_rgba(0,0,0,0.10)]">
        <div class="flex flex-col items-center">
          <img class="w-25 mb-4" src="./assets/github-logo.png" />
          <h2 class="font-semibold text-lg">Github Issues Tracker</h2>
          <p class="text-[#64748b] text-sm">Sign in to manage your issues</p>
        </div>
        <form class="flex flex-col space-y-2 w-full">
          <label for="">Username</label>
          <input id="user-input" type="text" placeholder="Enter Username" class="input w-full" />
          <label for="">Password</label>
          <input id="pass-input" type="password" placeholder="Enter Password" class="input w-full" />
          <a href="./home.html" id="loginBtn" class="btn btn-active btn-primary">Sing In</a>
        </form>
        <!-- <div class="relative flex py-5 items-center">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="flex-shrink mx-4 text-gray-400 text-sm font-medium">OR</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div> -->
        <hr class="w-full text-gray-400" />
        <div class="text-center">
          <p class="text-[#64748b] mb-4">Demo Credentials</p>
          <p>
            <span class="font-bold">Username:</span>
            admin
          </p>
          <p>
            <span class="font-bold">Password:</span>
            admin123
          </p>
        </div>
      </div>
    </section>

    <script src="./scripts/login.js"></script>
  </body>
</html>
